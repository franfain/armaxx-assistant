<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARMAXX Assistant</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#003366">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

header{
    background:#003366;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

h2{
    margin-top:0;
}

input,
select,
button{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    background:#003366;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.resultado{
    background:#eef6ff;
    border-left:5px solid #003366;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
}

.esquema-item{
    background:#eef6ff;
    padding:10px;
    margin:5px 0;
    border-left:4px solid #003366;
    border-radius:6px;
    cursor:pointer;
}

.esquema-item:hover{
    background:#d9ebff;
}

.historial-item{
    padding:8px;
    border-bottom:1px solid #ddd;
}

footer{
    text-align:center;
    color:#666;
    padding:20px;
}

</style>

</head>

<body>

<header>
<h1>ARMAXX Assistant</h1>
<p>Diagnóstico Serie de Seguridad</p>
</header>

<div class="container">

<div class="card">

<h2>Diagnóstico por tensión</h2>

<label>Último punto con tensión</label>
<select id="entrada"></select>

<label>Primer punto sin tensión</label>
<select id="salida"></select>

<button onclick="diagnosticar()">
Diagnosticar
</button>

<div id="resultado"></div>

</div>

<div class="card">

<h2>Buscar componente</h2>

<input
id="buscar"
placeholder="Ejemplo: SS9, WBF110, KA1"
/>

<button onclick="buscarComponente()">
Buscar componente
</button>

<div id="resultadoBusqueda"></div>

</div>

<div class="card">

<h2>Buscar punto</h2>

<input
id="buscarPunto"
placeholder="Ejemplo: 112B, LIM2, 119A"
/>

<button onclick="buscarPunto()">
Buscar punto
</button>

<div id="resultadoPunto"></div>

</div>

<div class="card">

<h2>Esquema interactivo</h2>

<div id="esquema"></div>

</div>

<div class="card">

<h2>Historial</h2>

<div id="historial"></div>

<button onclick="borrarHistorial()">
Borrar historial
</button>

</div>

</div>

<footer>
ARMAXX Assistant v2.1
</footer>

<script>

const tramos = [

{entrada:"110B",salida:"111",elemento:"STOP MOTOR",componentes:["SS4","WEB93"]},
{entrada:"111",salida:"112",elemento:"SELECTOR INSPECCION FOSO",componentes:["SIPS","HD3","HD4"]},
{entrada:"112",salida:"112A",elemento:"STOP FOSO",componentes:["SS5"]},
{entrada:"112A",salida:"112B",elemento:"POLEA TENSORA",componentes:["SS6","WBF32"]},
{entrada:"112B",salida:"113",elemento:"ESCALERA + ARSIS",componentes:["SS7A","SS7B","XBF2A","XBF2B","WBF33","WBF34"]},
{entrada:"113",salida:"114",elemento:"BUFFER CABINA 1",componentes:["SS8","WBF49"]},
{entrada:"114",salida:"115",elemento:"BUFFER CONTRAPESO",componentes:["SS9","WBF110"]},
{entrada:"115",salida:"116",elemento:"BUFFER CABINA 2",componentes:["SS10","WBF50"]},
{entrada:"116",salida:"118",elemento:"LIMITADOR",componentes:["SS11","WDAC116","XEB5"]},
{entrada:"118",salida:"LIM2",elemento:"ARSIS CABINA",componentes:["SC IN","SC OUT"]},
{entrada:"LIM2",salida:"119A",elemento:"PARACAIDAS",componentes:["AUX1","AUX2","XDA18","XDA17","WDA43"]},

{entrada:"119B",salida:"STP1",elemento:"INSPECCION TECHO",componentes:["SICS"]},
{entrada:"STP1",salida:"STP2",elemento:"TRAMPILLA Y AFLOJABLES",componentes:["SS16A","SS16B","SS16C","SS16D"]},
{entrada:"120",salida:"130",elemento:"PRESENCIA PUERTAS",componentes:["PRESENCIA"]},
{entrada:"130",salida:"133",elemento:"CERRADURAS EXTERIORES A",componentes:["A"]},
{entrada:"133",salida:"135",elemento:"CERRADURAS EXTERIORES B",componentes:["B"]},
{entrada:"135",salida:"137",elemento:"CERRADURA CABINA A",componentes:["KA1","KA2","XDA20","WMAP45"]},
{entrada:"137",salida:"140",elemento:"CERRADURA CABINA B",componentes:["KB1","KB2","XDA22","WMAP46"]}

];

const puntos=[];

tramos.forEach(t=>{

if(!puntos.includes(t.entrada))
puntos.push(t.entrada);

if(!puntos.includes(t.salida))
puntos.push(t.salida);

});

const entrada=document.getElementById("entrada");
const salida=document.getElementById("salida");

puntos.forEach(p=>{

entrada.innerHTML+=`<option>${p}</option>`;
salida.innerHTML+=`<option>${p}</option>`;

});

function diagnosticar(){

const tramo=tramos.find(t=>
t.entrada===entrada.value &&
t.salida===salida.value
);

if(!tramo){

resultado.innerHTML=
'<div class="resultado">Tramo no encontrado</div>';

return;

}

resultado.innerHTML=
`
<div class="resultado">

<h3>${tramo.entrada} ➜ ${tramo.salida}</h3>

<b>Elemento:</b><br>
${tramo.elemento}

<br><br>

<b>Revisar:</b><br>
${tramo.componentes.join(", ")}

</
